<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer background glow circle -->
  <circle cx="256" cy="256" r="236" fill="url(#vinylGrad)" stroke="url(#glowGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Vinyl grooves -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Center Label -->
  <circle cx="256" cy="256" r="80" fill="url(#centerGrad)" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="256" cy="256" r="20" fill="#090d16" stroke="#fbbf24" stroke-width="3"/>

  <!-- Waveform Accents -->
  <path d="M 190 256 Q 220 220 256 256 T 322 256" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M 175 256 Q 215 285 256 256 T 337 256" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Exploration Badge / Spark Icon -->
  <polygon points="256,70 266,95 292,95 271,110 279,135 256,120 233,135 241,110 220,95 246,95" fill="#f59e0b" filter="url(#glow)"/>
</svg>
